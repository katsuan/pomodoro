<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ぽもくる｜ポモドーロタイマー</title>
    <meta name="description" content="ぽもくる（PomoQ）。集中と休憩をくるくるくり返すポモドーロタイマー。">
    <meta property="og:type" content="website">
    <meta property="og:title" content="ぽもくる｜ポモドーロタイマー">
    <meta property="og:description" content="集中と休憩をくるくるくり返すポモドーロタイマー。">
    <meta property="og:url" content="https://katsuan.github.io/pomodoro/">
    <meta property="og:site_name" content="ぽもくる（PomoQ）">
    <meta property="og:image" content="https://katsuan.github.io/pomodoro/ogp.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="ぽもくる（PomoQ）：集中と休憩をくるくるくり返すポモドーロタイマー">
    <meta name="twitter:card" content="summary_large_image">
    <!-- アイコン・ロゴ・OGP は tools/icon.py で作る -->
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="icon" href="icon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="style.css?v=4">
    <link rel="manifest" href="manifest.json">
</head>

<body id="body">
    <div id="content" class="timer">
        <svg id="outside" class="timer-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <g class="timer-group">
                <circle cx="50" cy="50" r="47" class="timer-circle-background" />
                <circle cx="50" cy="50" r="40" class="timer-circle-accent" />
                <circle cx="50" cy="50" r="40" class="timer-circle-base" id="timer-circle-base"
                    stroke-dasharray="252" />
                <circle cx="50" cy="50" r="40" class="timer-circle-inner" id="timer-circle-inner"
                    stroke-dasharray="283" />
            </g>
        </svg>
        <div id="timer" class="timer-label">
            <div>
                <div id="time-label">Time</div>
                <div id="state"></div>
                <div id="timer-label">00:00</div>
                <div id="status">FocusTime</div>
                <div id="counter">pomodoro #00</div>
                <div id="volume">
                    <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0">
                    <p>Volume</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 設定（画面右下の ⚙️ から開く）。変えるとすぐ反映され、URL にも書き戻される -->
    <button id="settings-button" class="settings-button" type="button" aria-label="タイマーの設定">⚙️</button>
    <div id="settings" class="settings" hidden>
        <form id="settings-form" class="settings-card" aria-labelledby="settings-title">
            <!-- 名前は設定の中だけに出す（タイマーの画面はすっきりさせておく） -->
            <div class="settings-brand">
                <span class="settings-brand-name"><img src="icon.svg" alt="" width="24" height="24">ぽもくる</span>
                <img class="settings-brand-logo" src="logo.svg" alt="PomoQ" width="62" height="24">
            </div>
            <p class="settings-brand-copy">集中、休憩、くるくる回そう</p>
            <h2 id="settings-title" class="settings-title">タイマーの設定</h2>

            <div class="settings-presets" role="group" aria-label="よく使う組み合わせ">
                <button type="button" data-preset="25/5">25分 / 5分</button>
                <button type="button" data-preset="50/10">50分 / 10分</button>
                <button type="button" data-preset="45/15">45分 / 15分</button>
            </div>

            <label class="settings-row">
                <span>作業</span>
                <span class="settings-stepper">
                    <button type="button" data-step-for="work" data-step="-5" aria-label="作業を5分減らす">−</button>
                    <input name="work" type="number" inputmode="numeric" min="1" max="180" step="1">
                    <button type="button" data-step-for="work" data-step="5" aria-label="作業を5分増やす">＋</button>
                </span>
                <span class="settings-unit">分</span>
            </label>
            <label class="settings-row">
                <span>休憩</span>
                <span class="settings-stepper">
                    <button type="button" data-step-for="break" data-step="-1" aria-label="休憩を1分減らす">−</button>
                    <input name="break" type="number" inputmode="numeric" min="1" max="120" step="1">
                    <button type="button" data-step-for="break" data-step="1" aria-label="休憩を1分増やす">＋</button>
                </span>
                <span class="settings-unit">分</span>
            </label>
            <label class="settings-row">
                <span>開始時刻</span>
                <input name="start" type="time" class="settings-time">
                <span class="settings-unit"></span>
            </label>
            <p id="settings-cycle" class="settings-note"></p>

            <fieldset class="settings-toggles settings-sound">
                <legend>区切りの音</legend>
                <label><input name="sound" type="radio" value="chime"> チャイム</label>
                <label><input name="sound" type="radio" value="simple"> シンプル（ピッ・ポーン）</label>
                <label class="settings-volume">音量 <input name="volume" type="range" min="0" max="1" step="0.1" aria-label="音量"></label>
                <button id="settings-test" type="button" class="settings-secondary">▶ 試しに鳴らす</button>
            </fieldset>

            <fieldset class="settings-toggles">
                <legend>表示</legend>
                <label><input name="displayCounter" type="checkbox"> 回数</label>
                <label><input name="displayVolume" type="checkbox"> 音量バー</label>
            </fieldset>

            <div class="settings-actions">
                <button id="settings-copy" type="button" class="settings-secondary">URLをコピー</button>
                <button id="settings-reset" type="button" class="settings-secondary">初期値に戻す</button>
                <button id="settings-close" type="button" class="settings-primary">閉じる</button>
            </div>
            <!-- 「📤 ぽもくるを紹介する」：おくるんで紹介カードを送る窓口（line-share/shared/tool-share.js。中身は line-share/data/hub-links.json） -->
            <div data-tool-share></div>
        </form>
    </div>

    <script src="script.js?v=2" type="text/javascript"></script>
    <script src="https://katsuan.github.io/line-share/shared/tool-share.js" data-tool="pomoq" defer></script>
</body>
</html>
